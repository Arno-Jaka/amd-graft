[project]
name = "graft"
version = "0.1.0"
description = "CUDA to ROCm migration with correctness verification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["rocm", "hip", "cuda", "porting", "gpu", "amd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "paramiko>=3.4.0",
    "textual>=8.2.8",
    "textual-fspicker>=1.0.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.optional-dependencies]
# The Jupyter transport is the only caller of these; SSH and local work
# without them, so they are opt-in rather than a base requirement.
jupyter = [
    "requests>=2.32.0",
    "websocket-client>=1.8.0",
]

[project.scripts]
graft = "graft.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graft"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    # The Jupyter transport tests import these directly. They are an optional
    # runtime extra (see [project.optional-dependencies]) but the test suite
    # always exercises the transport, so they stay in the dev group.
    "requests>=2.32.0",
    "websocket-client>=1.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402", "F401"]
